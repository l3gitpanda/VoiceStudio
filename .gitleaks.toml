# Gitleaks config — extends the default ruleset.
#
# Every entry below is an exact, anchored non-secret value.
#
# Product analytics has been removed (see backend/core/analytics.py), so no
# PostHog token is committed any more. The last publishable `phc_` project
# token (a write-only client key, never a credential) is still in git history,
# which the full-history scan reads, so its exact value stays allowlisted.
# `tests/test_telemetry_removed.py` fails if a `phc_` literal reappears in any
# tracked file other than this one. Personal keys (`phx_`) remain fully banned.

[extend]
useDefault = true

[allowlist]
description = "Exact public/test literals misclassified as generic API keys"
regexes = [
  # Retired public PostHog project token, still present in git history.
  '''^phc_kJK9nFqtwFmB4CYWS4bMDTY7z9P4KCRyiRT7CzJTXm9f$''',
  # Reviewed immutable Hugging Face commit for the Higgs tokenizer.
  '''^528e871c2a26c4f0f7773b9754e2e1acae20899d$''',
  # Deliberately synthetic fixtures that exercise HF-token redaction/storage.
  '''^hf_abcdefghijklmnopqrstuvwxyz01234567890abcd$''',
  '''^hf_abcdefghijklmnopqrstuvwxyz0123456789ABCDEF$''',
  '''^hf_QWERTYUIOPasdfghjklZXCVBNM0123456789xyzAB$''',
  # NLLB generation length argument, not the value of a credential.
  '''^max_length=400$''',
  # Dubbing pane split-position localStorage key, not a credential.
  '''^omnivoice\.dubSplit\.v1$''',
  # cryptography's Ed25519 private-key type name, not key material.
  '''^Ed25519PrivateKey$''',
]
